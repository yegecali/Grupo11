name: confluence-sync

# Sincroniza knowledge/ con un espacio de Confluence. El motor del agente nunca lee Confluence:
# "subir" publica un espejo de lectura; "traer" abre un PR con lo editado en Confluence para
# revisión humana antes de fusionarlo (knowledge/ sigue siendo la única fuente de verdad, AGENTS.md regla 6).
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "subir knowledge/ a Confluence, o traer cambios de Confluence como PR"
        required: true
        type: choice
        options: [subir, traer]
        default: subir
  push:
    branches: [main]
    paths: ["knowledge/**"]

permissions: {}

concurrency:
  group: confluence-sync
  cancel-in-progress: false

jobs:
  subir:
    if: github.event_name == 'push' || github.event.inputs.accion == 'subir'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: kanban
    permissions:
      contents: read
    env:
      CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_PARENT_PAGE_ID: ${{ vars.CONFLUENCE_PARENT_PAGE_ID }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Publicar knowledge/ en Confluence
        run: node scripts/confluence-push.mjs

  traer:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.accion == 'traer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: kanban
    permissions:
      contents: write
      pull-requests: write
    env:
      CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE_KEY: ${{ vars.CONFLUENCE_SPACE_KEY }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Traer estándares desde Confluence
        id: traer
        run: node scripts/confluence-pull.mjs
      - name: Abrir PR con los cambios
        if: steps.traer.outputs.cambios == 'true'
        run: |
          set -e
          rama="confluence-sync/${GITHUB_RUN_ID}"
          git config user.name "confluence-sync[bot]"
          git config user.email "confluence-sync[bot]@users.noreply.github.com"
          git checkout -b "$rama"
          git add knowledge/*.md
          git commit -m "docs(knowledge): sincroniza estándares desde Confluence"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$rama"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$rama" --base main \
            --title "docs(knowledge): sincroniza estándares desde Confluence" \
            --body "Trae los cambios hechos en Confluence para los estándares editables. Revisa el diff antes de aprobar: knowledge/ sigue siendo la fuente de verdad que lee el motor."
